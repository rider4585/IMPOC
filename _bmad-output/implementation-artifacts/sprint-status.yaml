sequencing:
  epic_order: "Epics run 1 through 11 in build/migration order. Epic 12 (owner dashboard)
    is deliberately sequenced last, after Epic 11 (deployment) — moved there by Raviraj
    so it can be designed once the shop has actually been run. Its three migrations
    (report views, index set, user_preferences) are consequently the build's last
    three, slots 23-25, run after Epic 11, which ships none of its own."
  gates:
    - epic: 1
      rule: "Epic 1 gates everything. Nothing can be scanned until barcodes are unique
        (FR-D2) and A4 sheets print correctly (FR-D1). No intake, cart, or rental
        work starts before Epic 1 closes. Within Epic 1, the backend foundation (Stories
        1.1-1.9) comes before the frontend foundation (1.10-1.17)."
    - story: "1.10"
      key: 1-10-establish-the-platform-module-idempotency-cold-start-retry-e
      rule: "Hard prerequisite for every screen in Epics 2 onward. Stands up the frontend
        platform module that owns four of the five client-side obligations the spine
        leaves homeless: idempotency key (AD-22), cold-start retry (AD-19.1), collection
        envelope (AD-26), money formatting (AD-2). The fifth, cart.js (AD-25), is
        added on top of this module by Story 5.1, once Epic 5 has a cart to manage.
        Every later frontend story imports from this module rather than reimplementing
        any of the five."
    - story: "1.15"
      key: 1-15-route-guard-app-shell-and-permission-driven-navigation
      rule: "Hard prerequisite for every screen in Epics 2 onward. Stands up the route
        guard and the permission-driven app shell/navigation registry (AD-29, UX-DR16);
        every later frontend story registers its nav entry through this registry rather
        than a role-name check."
    - story: "4.1"
      key: 4-1-create-unit_status_events-and-stand-up-units-service-transit
      rule: "Hard prerequisite for every later epic. Stands up units.service.transitionUnit(),
        the sole writer of unit status/channel/rental snapshots (AD-8). Every later
        epic that touches unit state calls into it rather than writing units.status
        directly."

