<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Pet — Sprite Engine (dev tuning page)</title>
  <style>
    :root{ --bg:#0f1420; --panel:#161d2e; --accent:#5aa9ff; --text:#dfe8f7; --muted:#7d8aa3; }
    *{ box-sizing:border-box; }
    body{ margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px;
      background: radial-gradient(circle at 50% 20%, #1b2440, #0b0f1a 70%); font-family:'Segoe UI', Roboto, system-ui, sans-serif; color:var(--text); padding:32px 16px; }
    h1{ font-size:18px; letter-spacing:.03em; color:var(--muted); font-weight:600; margin:0; text-transform:uppercase; }
    #stage{ background:var(--panel); border-radius:20px; padding:28px 40px; box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.04); }
    canvas{ image-rendering:pixelated; display:block; }
    #panel{ width:min(640px,92vw); background:var(--panel); border-radius:16px; padding:18px 20px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.04); }
    #panel h2{ font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:0 0 12px; }
    #buttons{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
    button{ background:#1f2a44; color:var(--text); border:1px solid #2c3a5c; border-radius:999px; padding:8px 16px; font-size:13px; cursor:pointer; }
    button:hover{ background:#2a3860; }
    button.active{ background:var(--accent); color:#04101f; border-color:var(--accent); font-weight:600; }
    .row{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); margin-top:8px; }
    input[type=range]{ flex:1; accent-color:var(--accent); }
    code{ background:#0b101c; color:#9fd1ff; padding:2px 6px; border-radius:6px; font-size:12px; }
    #log{ font-size:11px; color:var(--muted); font-family:Consolas, monospace; max-height:90px; overflow-y:auto; margin-top:12px; line-height:1.5; }
  </style>
</head>
<body>
<h1>Digital Pet Sprite Engine</h1>
<div id="stage"><canvas id="pet-canvas"></canvas></div>
<div id="panel">
  <h2>Trigger an animation</h2>
  <div id="buttons"></div>
  <div class="row"><span>Speed</span><input type="range" id="fpsRange" min="2" max="20" value="8"><span id="fpsLabel">8 fps</span></div>
  <div class="row"><span>Scale</span><input type="range" id="scaleRange" min="1" max="4" step="0.5" value="2"><span id="scaleLabel">2x</span></div>
  <div class="row"><button id="autoBtn">Start random scheduler</button><span>the same weighted random cycle the display screen uses</span></div>
  <div class="row">Call from devtools with <code>window.pet.play('coding')</code></div>
  <div id="log"></div>
</div>

<!--
  DEV-ONLY tuning page (R-53). It imports the real engine module from /src so
  there is exactly one copy of the engine + config. Works under `vite dev`
  at /pet/pet-engine.html; it is not part of the production bundle.
-->
<script type="module">
  import { SpriteEngine, PET_CONFIG, PET_SHEET_SRC, createPetScheduler } from '/src/platform/petEngine.js';

  const log = (msg) => {
    const el = document.getElementById('log');
    const line = document.createElement('div');
    line.textContent = `> ${msg}`;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  };

  const canvas = document.getElementById('pet-canvas');
  const pet = new SpriteEngine(canvas, PET_SHEET_SRC, { ...PET_CONFIG, scale: 2 });
  window.pet = pet;

  const scheduler = createPetScheduler(pet, { onChange: (name, holdMs) => log(`scheduler → ${name}${holdMs ? ` for ${(holdMs / 1000).toFixed(1)}s` : ' (one shot)'}`) });
  let auto = false;

  pet.onReady = () => { pet.play('idle'); log('spritesheet loaded, playing "idle"'); };
  pet.onPlay = (name) => {
    document.querySelectorAll('#buttons button[data-name]').forEach((b) => b.classList.toggle('active', b.dataset.name === name));
  };

  const buttonsEl = document.getElementById('buttons');
  for (const name of Object.keys(PET_CONFIG.animations)) {
    const btn = document.createElement('button');
    btn.textContent = name;
    btn.dataset.name = name;
    btn.onclick = () => { if (auto) { scheduler.stop(); auto = false; autoBtn.textContent = 'Start random scheduler'; } pet.play(name, { onComplete: () => pet.play('idle') }); };
    buttonsEl.appendChild(btn);
  }

  const autoBtn = document.getElementById('autoBtn');
  autoBtn.onclick = () => {
    auto = !auto;
    if (auto) { scheduler.start(); autoBtn.textContent = 'Stop random scheduler'; }
    else { scheduler.stop(); autoBtn.textContent = 'Start random scheduler'; }
  };

  document.getElementById('fpsRange').addEventListener('input', (e) => {
    const v = Number(e.target.value);
    document.getElementById('fpsLabel').textContent = `${v} fps`;
    pet.fps = v;
  });
  document.getElementById('scaleRange').addEventListener('input', (e) => {
    const v = Number(e.target.value);
    document.getElementById('scaleLabel').textContent = `${v}x`;
    pet.setScale(v);
  });
</script>
</body>
</html>
