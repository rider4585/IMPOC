<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark"/>
    <title>Shop Management System</title>
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('impoc-theme-settings') || '{}');
          // Bug-free pre-hydration theme: default to DARK, resolve 'system' via OS.
          var scheme = s.colorScheme || 'dark';
          if (scheme === 'system') {
            try {
              scheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            } catch (e) { scheme = 'dark'; }
          }
          var r = document.documentElement;
          r.setAttribute('data-theme', scheme);
          r.setAttribute('data-primary', s.primaryColor || 'default');
          r.setAttribute('data-font', s.fontFamily || 'minimals');
        } catch (e) {}
      })();
    </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
